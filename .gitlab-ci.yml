image: node:22

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - release

verify:
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - npm run version:check
    - npm test

release-check:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm run release:check
