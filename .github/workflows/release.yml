name: Release

# The release ref is the annotated v* tag a maintainer pushes. This workflow
# re-runs the full release checks against that tag and then publishes the
# workspace to npm through trusted publishing (OIDC), so no npm token is
# stored in the repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # release:check의 tarball-compat이 기준 릴리스 커밋을 worktree로 꺼내므로
      # 얕은 checkout으로는 실행할 수 없다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the
      # npm bundled with Node 22.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Configure git
        run: |
          git config --global user.name "Rundol CI"
          git config --global user.email "ci@rundol.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Run release checks
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: npm run release:check
      # Dependency order: core and protocol first, then the packages that
      # depend on them, then the integrated distribution. Versions already on
      # the registry are skipped so a re-run is safe.
      #
      # dist-tag는 버전이 정한다. npm publish의 기본값은 버전이 prerelease여도
      # latest이므로, --tag 없이 0.38.0-rc.1을 올리면 npm i -g rundol을 하는
      # 모든 사용자가 검증 전 판을 받는다. prerelease는 next로 보내고 latest는
      # 정식판만 차지한다 — 설치자가 rc를 원하면 rundol@next로 명시한다.
      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in core protocol board node cli rundol; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "skip     $name@$version (already published)"
              continue
            fi
            case "$version" in
              *-*) tag=next ;;
              *)   tag=latest ;;
            esac
            echo "publish  $name@$version (dist-tag: $tag)"
            npm publish "./packages/$dir" --provenance --access public --tag "$tag"
          done
