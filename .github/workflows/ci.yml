name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

# A branch push and its open pull request would otherwise run the same commit
# twice; keep only the newest run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure git
        run: |
          git config --global user.name "Rundol CI"
          git config --global user.email "ci@rundol.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run version:check
      - run: npm test

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure git
        run: |
          git config --global user.name "Rundol CI"
          git config --global user.email "ci@rundol.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Run release checks
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: npm run release:check
