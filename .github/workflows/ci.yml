name: CI

# Tag refs are handled by release.yml, which runs the full release checks
# before publishing.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A branch push and its open pull request would otherwise run the same commit
# twice; keep only the newest run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure git
        run: |
          git config --global user.name "Rundol CI"
          git config --global user.email "ci@rundol.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run version:check
      - run: npm test
