name: CI

# Tag refs are handled by release.yml, which runs the full release checks
# before publishing.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A branch push and its open pull request would otherwise run the same commit
# twice; keep only the newest run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: windows-latest
            node: '20'
          - os: macos-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
    steps:
      # 혼합 버전 호환 테스트(p15-compat, tarball-compat)가 기준 릴리스 커밋을
      # worktree로 꺼내므로 얕은 checkout으로는 실행할 수 없다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure git
        run: |
          git config --global user.name "Rundol CI"
          git config --global user.email "ci@rundol.invalid"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run version:check
      - run: npm test
